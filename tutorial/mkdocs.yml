      - Standard generation pipeline: presenton/08-standard-pipeline.md
      - Prompts and schemas: presenton/09-prompts-and-schemas.md
      - Streaming (SSE): presenton/10-streaming.md
      - Document ingestion: presenton/11-document-ingestion.md
